<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
<title>Notes</title><link rel="stylesheet" href="style.css"></head><body><main>
<p class="eyebrow">YOUR LOCAL NOTEBOOK</p><h1>A little space to remember.</h1>
<p>Write a thought. Keep it here, on this device.</p>
<form><label for="note">New note</label><div class="entry"><input id="note" autocomplete="off" placeholder="What would you like to remember?"><button type="submit">Save note</button></div></form>
<p id="status" role="status" aria-live="polite"></p><h2>Saved notes</h2><p id="empty">Your notebook is empty. Add your first note above.</p><ul id="notes"></ul>
</main><script src="renderer.js"></script></body></html>
